    <circle cx="26.5" cy="33.2" r="4.6" fill="#fff" fill-opacity=".3" stroke="#111" stroke-width="1.7"/>
    <circle cx="37.5" cy="33.2" r="4.6" fill="#fff" fill-opacity=".3" stroke="#111" stroke-width="1.7"/>
